name: CI

on:
  push:
    branches: [main]
  # synchronize stays: a push to a PR that is already open for review is tested, so the
  # commit that gets merged is never an untested one. Draft PRs are skipped by the job
  # conditions below, which is where the quiet iteration happens.
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

# One run per branch. Pushing again cancels the run still going for the previous commit,
# which is the common case while a branch is being iterated on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # CODECOV_TOKEN is an environment secret, and a job cannot read one without
    # naming its environment. go-gao-coverage carries no protection rules, so this
    # gates nothing.
    environment: go-gao-coverage
    strategy:
      fail-fast: false
      matrix:
        # 1.25 is the floor go.mod declares, so it is tested rather than assumed;
        # 1.27 is what the code is developed against. The compiler pins the language
        # version from go.mod and vet's stdversion analyser rejects too-new library
        # symbols, so what this pair adds is coverage of runtime and codegen
        # differences, which neither of those catches.
        goversion: ['1.25', '1.27']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.goversion }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # No -race here: combined with coverage instrumentation, the field package's seed
      # corpus runs past the default 10m timeout. The step below races the one package
      # where the detector can actually fire, without coverage.
      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # fail_ci_if_error stays false: a Codecov outage is not a reason to redden a
      # build whose tests passed.
      - name: Upload coverage
        # One report per commit; the matrix legs cover identical statements.
        if: matrix.goversion == '1.27'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Only this package, and only under the detector -- not ./... .
      #
      # A *Code is documented as safe to share, and the decoder it shares reaches real
      # mutable state: the poly ring's twiddle cache and the package-level NTT scratch
      # pool. TestDecodeIsConcurrencySafe is the test that exercises it, and without
      # -race it is eight goroutines asserting nothing.
      #
      # field/ is excluded because no test there starts a goroutine, so the detector has
      # nothing to find, and instrumenting its arithmetic costs minutes. Extend this if a
      # concurrent test is ever added under field/.
      - name: Test the concurrency contract under the race detector
        run: go test -race -count=1 .

  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # `unused` here catches dead declarations that `go vet` cannot see: it only
      # reports unused locals and imports, never an unreferenced helper or an
      # exported-but-unreachable method.
      - uses: golangci/golangci-lint-action@v9
        with:
          # v2.12.2 bundles staticcheck v0.7.0, whose IR builder panics on Go 1.27
          # source ("unexpected expr: *ast.KeyValueExpr" while analysing internal/poll).
          # v2.13.2 carries staticcheck v0.8.1, which handles it.
          version: v2.13.2
          # Built here rather than downloaded, so the linter is compiled with the same
          # Go as the code it analyses.
          install-mode: goinstall

  fuzz:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      # 1.27 is required, not merely preferred: fuzzing on 1.25 and 1.26 hits
      # go.dev/issue/75804, where an error arriving between the fuzztime deadline and
      # the workers' cancellation is misreported as a finding. Not backported.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # The committed testdata/ corpus runs as ordinary tests on every `go test`.
      # This job additionally fuzzes briefly, to catch regressions the seeds miss.
      #
      # The targets are discovered rather than listed. A hardcoded list went stale when
      # FuzzNttPEEA was deleted, and `go test -fuzz` exits 0 on a pattern matching
      # nothing, so the gap was silent.
      - name: Fuzz smoke
        run: |
          for pkg in ./field/ .; do
            for target in $(go test -list='Fuzz' "$pkg" | grep '^Fuzz'); do
              echo "== $pkg $target"
              go test "$pkg" -run=XXX -fuzz="^${target}$" -fuzztime=30s
            done
          done

  govulncheck:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
