name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # `unused` here catches dead declarations that `go vet` cannot see: it only
      # reports unused locals and imports, never an unreferenced helper or an
      # exported-but-unreachable method.
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # The committed testdata/ corpus runs as ordinary tests on every `go test`.
      # This job additionally fuzzes briefly, to catch regressions the seeds miss.
      - name: Fuzz smoke
        run: |
          for target in FuzzPEEA FuzzNttPEEA FuzzInterpolation FuzzInverse FuzzNegate FuzzSub_Simple; do
            echo "== $target"
            go test -run=XXX -fuzz="^${target}$" -fuzztime=30s ./field/
          done

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
