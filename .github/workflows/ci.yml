name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # No -race here: combined with coverage instrumentation, the field package's seed
      # corpus runs past the default 10m timeout. The step below races the one package
      # where the detector can actually fire, without coverage.
      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # Only this package, and only under the detector -- not ./... .
      #
      # A *Code is documented as safe to share, and the decoder it shares reaches real
      # mutable state: the poly ring's twiddle cache and the package-level NTT scratch
      # pool. TestDecodeIsConcurrencySafe is the test that exercises it, and without
      # -race it is eight goroutines asserting nothing.
      #
      # field/ is excluded because no test there starts a goroutine, so the detector has
      # nothing to find, and instrumenting its arithmetic costs minutes. Extend this if a
      # concurrent test is ever added under field/.
      - name: Test the concurrency contract under the race detector
        run: go test -race -count=1 .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # `unused` here catches dead declarations that `go vet` cannot see: it only
      # reports unused locals and imports, never an unreferenced helper or an
      # exported-but-unreachable method.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # The committed testdata/ corpus runs as ordinary tests on every `go test`.
      # This job additionally fuzzes briefly, to catch regressions the seeds miss.
      #
      # The targets are discovered rather than listed. A hardcoded list went stale when
      # FuzzNttPEEA was deleted, and `go test -fuzz` exits 0 on a pattern matching
      # nothing, so the gap was silent.
      - name: Fuzz smoke
        run: |
          for pkg in ./field/ .; do
            for target in $(go test -list='Fuzz' "$pkg" | grep '^Fuzz'); do
              echo "== $pkg $target"
              go test "$pkg" -run=XXX -fuzz="^${target}$" -fuzztime=30s
            done
          done

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
